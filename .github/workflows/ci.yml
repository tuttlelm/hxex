name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Install story on the other platforms (CPU PyTorch from PyPI): the oldest
          # supported Python, a middle one and the newest.
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install CPU-only PyTorch (Linux; smaller than the default wheel)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package with development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  min-versions:
    name: lowest supported dependency versions (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      # Keep the torch pin equal to the lower bound in pyproject.toml.
      - name: Install PyTorch at its lower bound (CPU)
        run: uv pip install --system "torch==2.5.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install everything else at the lowest allowed versions
        run: uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Test
        run: pytest
